{{- /* 评论（giscus）。启用步骤：
1. 打开 https://github.com/AntarcticaLin/antarct-blog/settings → General → Features → 勾选 Discussions；
2. 打开 https://giscus.app/，点击 "利用 GitHub 应用" 授权，选择本仓库；
3. 按提示选择 Discussion 分类（如 General），页面会生成一段 <script>；
4. 把其中的 data-repo-id、data-category、data-category-id 三个值填到下方对应位置；
5. 保存并推送，重新部署后评论即生效。
*/ -}}
{{- if (.Param "comments") }}
<script src="https://giscus.app/client.js"
        data-repo="AntarcticaLin/antarct-blog"
        data-repo-id="REPO_ID_PENDING"
        data-category="REPO_CATEGORY_PENDING"
        data-category-id="CATEGORY_ID_PENDING"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
{{- end }}
